# This workflow generates HTML profile (fully rebuilt, no old gradients).
# No longer uses overview.py SVG cards; uses overview.py which mirrors the site CSS.

name: GitHub Statistics

on:
  push:
    branches: [ main ]
  schedule:
  - cron: '30 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn --batch-mode verify

    - name: Compile statistics
      id: compile
      continue-on-error: true
      run: |
        java --version
        java -cp target/gs-1.0-jar-with-dependencies.jar Main
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    - name: Generate SVG cards (website style, no old visuals)
      run: python3 overview.py

    - name: Commit new outputs
      run: |
        git config --global user.name 'github-statistics'
        git config --global user.email 'applex250@users.noreply.github.com'
        git add output generated_readme.md || true
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m 'Update outputs (HTML rebuilt)'
          git push
        fi

    - name: Checkout profile repository
      uses: actions/checkout@v6
      with:
        repository: applex250/applex250
        path: profile
        token: ${{ secrets.ACCESS_TOKEN }}

    - name: Update profile README (HTML)
      run: |
        cp generated_readme.md profile/README.md
        cd profile
        git config --global user.name 'applex250'
        git config --global user.email 'applex250@users.noreply.github.com'
        git add README.md
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m 'Update README.md (HTML rebuilt)'
          git push
        fi
