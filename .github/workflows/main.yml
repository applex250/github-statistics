# This workflow automatically compiles GitHub statistics into SVG cards and
# publishes them to the profile README (applex250/applex250).
# 参考 tanjeffreyz/github-statistics 的工作流,私有 github-overview 部分已替换为仓库内置 overview.py。

name: GitHub Statistics

on:
  push:
    branches: [ main ]
  schedule:
  - cron: '30 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn --batch-mode verify

    - name: Compile statistics
      run: |
        java --version
        java -cp target/gs-1.0-jar-with-dependencies.jar Main
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    - name: Generate SVG cards + profile README
      run: python3 overview.py

    - name: Commit new outputs
      run: |
        git config --global user.name 'github-statistics'
        git config --global user.email 'applex250@users.noreply.github.com'
        git add output || true
        git commit -m 'Update outputs' || true
        git push

    - name: Checkout profile repository
      uses: actions/checkout@v6
      with:
        repository: applex250/applex250
        path: profile
        token: ${{ secrets.ACCESS_TOKEN }}

    - name: Update profile README
      run: |
        cp generated_readme.md profile/README.md
        cd profile
        git config --global user.name 'applex250'
        git config --global user.email 'applex250@users.noreply.github.com'
        git add README.md
        git commit -m 'Update README.md' || true
        git push
