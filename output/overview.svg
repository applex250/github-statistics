            }
            .overview-background {
                opacity: 0%;
                animation: fade-in-overview-background 0.75s forwards ease-in-out;
                animation-delay: 0s;            }
            @keyframes fade-in-overview-background {
                0% {
                    opacity: 0%;
                }
                100% {
                    opacity: 100%;
                }
            }

        @keyframes anim-card0 {
            0% { opacity: 0%; }
            18% { opacity: 100%; transform: translate(2.5%,0); }
            30% { opacity: 25%; transform: translate(2.5%,0) translateX(-6px); }
            42% { opacity: 100%; transform: translate(2.5%,0) translateX(6px); }
            54% { opacity: 30%; transform: translate(2.5%,0) translateX(-3px); }
            70% { opacity: 100%; transform: translate(2.5%,0); }
            100% { opacity: 100%; transform: translate(2.5%,0); }
        }
        .card0 {
            opacity: 0%;
            animation: anim-card0 1.8s forwards steps(1,end);
        }

        @keyframes anim-card1 {
            0% { opacity: 0%; transform: translate(21.5%,0) translateX(60px); }
            100% { opacity: 100%; transform: translate(21.5%,0) translateX(0); }
        }
        .card1 {
            opacity: 0%;
            animation: anim-card1 1.375s forwards ease-out;
        }

        @keyframes anim-card2 {
            0% { opacity: 0%; transform: translate(40.5%,0) translateY(40px); }
            60% { opacity: 100%; transform: translate(40.5%,0) translateY(-10px); }
            80% { transform: translate(40.5%,0) translateY(4px); }
            100% { opacity: 100%; transform: translate(40.5%,0) translateY(0); }
        }
        .card2 {
            opacity: 0%;
            animation: anim-card2 1.5s forwards cubic-bezier(.28,.84,.42,1);
        }

        @keyframes anim-card3 {
