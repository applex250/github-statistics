            animation: anim-card3 1.375s forwards ease-out;
        }

        @keyframes anim-card4 {
            0% { opacity: 0%; transform: translate(78.5%,0) translateY(-50px); }
            100% { opacity: 100%; transform: translate(78.5%,0) translateY(0); }
        }
        .card4 {
            opacity: 0%;
            animation: anim-card4 1.375s forwards ease-in;
        }

